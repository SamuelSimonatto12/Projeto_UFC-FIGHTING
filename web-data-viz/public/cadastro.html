<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <link rel="stylesheet" href="css/cadastroElogin.css">
</head>

<body>


  <div class="container">
    <form class="form">
      <h2>Cadastro</h2>
      <input type="text" class="campo" placeholder="Nome Completo" id="InNome">
      <p style="display: none; color: red;" id="nomeIn">Nome Inválido</p>
      <input type="text" class="campo" placeholder="Email" id="InEmail">
      <p style="display: none; color: red;" id="emailIn">Email Inválido</p>
      <input type="password" class="campo" placeholder="Senha" id="InSenha">
      <p style="display: none; color: red;" id="senhaIn">Senha Inválida</p>
      <button type="button" class="botao" onclick="cadastrar()">Cadastrar</button>
      <div id="div_mensagem"></div>
      <p class="link-cadastro">
        Já possui uma conta? <a href="login.html">Clique aqui</a>
      </p>
    </form>
  </div>

</body>

</html>
<script src="js/validacoes.js"></script>
<script src="js/validacoes.js"></script>

<script>

function cadastrar() {

    let nome = InNome.value;
    let email = InEmail.value;
    let senha = InSenha.value;


    if (!validarNome(nome)) {
        alert("Nome inválido");
        return;
    }

    if (!validarEmail(email)) {
        alert("Email inválido");
        return;
    }

    if (!validarSenha(senha)) {
        alert("Senha inválida");
        return;
    }


    div_mensagem.innerHTML = "✅ Cadastro realizado!Redirecionando...";
    div_mensagem.style.color = "green";


    fetch("/usuarios/cadastrar", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
        },
        body: JSON.stringify({
            nomeServer: nome,
            emailServer: email,
            senhaServer: senha,
        }),
    })

    .then(function (resposta) {

        console.log("resposta: ", resposta);

        if (resposta.ok) {

            setTimeout(() => {
                window.location = "login.html";
            }, 2000);

        } else {
            throw "Houve um erro ao tentar realizar o cadastro!";
        }

    })

    .catch(function (erro) {
        console.log(`#ERRO: ${erro}`);
    });

}

</script>
